services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tivot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tivot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tivot_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [tivot_internal]

  backend:
    build: ./telemetry-backend
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://tivot:tivot_secret@postgres:5432/tivot_db}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-in-production}
      TELEMETRY_CLIENT_KEY: ${TELEMETRY_CLIENT_KEY:-}
      RESEARCHER_PASSWORD: ${RESEARCHER_PASSWORD:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8000}:8000"
    networks: [tivot_internal]

  frontend:
    build:
      context: .
      args:
        VITE_TELEMETRY_API_URL: ${VITE_TELEMETRY_API_URL:-http://localhost:8000/api/v1}
        VITE_RESEARCH_CONDITION: ${VITE_RESEARCH_CONDITION:-standard}
        VITE_AI_PROVIDER: ${VITE_AI_PROVIDER:-qwen}
        VITE_AI_BASE_URL: ${VITE_AI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
        VITE_AI_MODEL_NAME: ${VITE_AI_MODEL_NAME:-gemini-1.5-flash}
        VITE_AI_TIMEOUT_MS: ${VITE_AI_TIMEOUT_MS:-15000}
        VITE_AI_TEMPERATURE: ${VITE_AI_TEMPERATURE:-0.4}
        VITE_QWEN_API_KEY: ${VITE_QWEN_API_KEY:-}
        VITE_QWEN_BASE_URL: ${VITE_QWEN_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
        VITE_QWEN_MODEL: ${VITE_QWEN_MODEL:-qwen-plus}
        VITE_TELEMETRY_CLIENT_KEY: ${VITE_TELEMETRY_CLIENT_KEY:-}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks: [tivot_internal]

  dashboard:
    build:
      context: ./analytics-dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8081}:80"
    networks: [tivot_internal]

volumes:
  postgres_data:

networks:
  tivot_internal:
    driver: bridge
